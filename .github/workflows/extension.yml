name: extension

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check extension
        run: npm run check -w @chatenhancer/extension
      - name: Check shared code and repository tools
        run: npm run check -w @chatenhancer/eslint-config -w @chatenhancer/playground-core -w @chatenhancer/repo-tools
      - name: Lint root configuration
        run: npm exec -- eslint eslint.config.mjs vitest.config.mjs

  test:
    name: Test extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test extension and scripts with coverage
        run: npm run test:coverage
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-test-report
          path: test-results/unit/vitest-report.json
          if-no-files-found: ignore
          retention-days: 1

  build:
    name: Build extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build extensions
        run: npm run build

  e2e:
    name: Test extension end to end
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npm run test:e2e:install -w @chatenhancer/extension
      - name: Build Chrome extension
        run: npm run build:chrome
      - name: Run E2E gate
        run: npm run test:e2e:ci -w @chatenhancer/extension
      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-test-report
          path: test-results/e2e/playwright-report.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Collect mock E2E failure artifacts
        if: failure()
        run: npm run ci:e2e-artifacts -w @chatenhancer/repo-tools
      - name: Upload mock E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mock-e2e-failure-artifacts
          path: test-results/e2e/mock-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Verify extension
    needs:
      - check
      - test
      - build
      - e2e
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
      - name: Download unit test report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        continue-on-error: true
        with:
          name: unit-test-report
          path: test-results/unit
      - name: Download E2E test report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        continue-on-error: true
        with:
          name: e2e-test-report
          path: test-results/e2e
      - name: Write test summary
        if: always()
        run: npm run ci:test-summary -w @chatenhancer/repo-tools
      - name: Require successful jobs
        if: |
          always() && (
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled') ||
            contains(needs.*.result, 'skipped')
          )
        run: exit 1
