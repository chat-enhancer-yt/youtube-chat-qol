name: stockfish-container

on:
  pull_request:
    paths:
      - '.github/workflows/stockfish-container.yml'
      - 'cloudflare/playground/src/durable-objects/stockfish-container/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stockfish-container.yml'
      - 'cloudflare/playground/src/durable-objects/stockfish-container/**'
  workflow_dispatch:

jobs:
  smoke:
    name: Test Stockfish container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build Stockfish container
        run: docker build --tag ytcq-stockfish-smoke cloudflare/playground/src/durable-objects/stockfish-container
      - name: Start Stockfish container
        run: docker run --detach --name ytcq-stockfish-smoke --publish 127.0.0.1:18080:8080 ytcq-stockfish-smoke
      - name: Test Stockfish container
        run: python3 -B cloudflare/playground/src/durable-objects/stockfish-container/smoke.py
      - name: Show Stockfish container logs
        if: failure()
        continue-on-error: true
        run: docker logs ytcq-stockfish-smoke
      - name: Remove Stockfish container
        if: always()
        continue-on-error: true
        run: docker rm --force ytcq-stockfish-smoke
