name: Bug report
description: Report anything in the extension that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce the issue without exposing private chat content.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what happened, where it happened, and what you expected instead.
      placeholder: "Example: The Inbox button appears, but clicking it does not open the inbox."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Open a YouTube livestream.
        2. Enable ...
        3. Click ...
        4. See ...
    validations:
      required: true

  - type: input
    id: video-url
    attributes:
      label: Example video or livestream URL
      description: Optional. Only include a URL if it is public and safe to share.
      placeholder: "https://www.youtube.com/watch?v=..."

  - type: textarea
    id: environment
    attributes:
      label: Browser and extension details
      description: Include the browser and version, extension version, and install source.
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: Include only settings that seem related to the problem.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: If useful, attach screenshots. Please avoid sharing private information.

  - type: textarea
    id: console-errors
    attributes:
      label: Console errors or technical details
      description: Optional. If you know how to inspect the page, paste relevant console errors or DOM details.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add relevant YouTube UI changes or anything else that may help explain the bug.
